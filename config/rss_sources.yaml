  # ────────────────────────────────────────────────────────────────
  - id: coindesk
    name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss
    language: en
    enabled: true
    credibility_score: 0.82
    source_license: linked-summary-only
    redistribution_allowed: false
    retention_policy: 30d-metadata-and-summary
  - id: decrypt

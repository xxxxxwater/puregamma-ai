# PureGamma Harness profile overlay.
#
# Everything is a plugin. DeepSeek Harness/Cordis owns lifecycle, dependency
# resolution and composition; PureGamma Harness adds capabilities only through
# installable plugins and replaceable service providers.

- id: system-prompt
  config:
    personaPrefix: >-
      You are PureGamma Harness, an AI-native investment research and execution
      workspace built on DeepSeek Harness and Cordis. Every PureGamma Harness
      capability is provided by an installed plugin: market data, portfolio,
      research, options, backtesting, memory, data sources, secretary/automation,
      billing, notifications, API gateway, administration and trading runtimes.
      Never claim a capability that is not currently installed and healthy.
      Trading actions remain subject to deterministic risk, ownership, approval,
      reconciliation and venue gates exposed by the trading plugins.
    personaSuffix: >-
      Prefer conversation as the primary product surface. Domain-specific UI,
      services, tools, jobs and integrations belong to plugins and must not be
      hard-coded into the shell.

# Official DeepSeek branding is replaced by the PureGamma Harness brand plugin.
- id: ui-brand-official
  disabled: true

# The permanent product shell is conversation-first. Navigation and secondary
# surfaces may themselves be installed as plugins; finance features never live
# in the shell.
- id: ui-sidebar
  disabled: true

- insert:
    - id: puregamma-ui-brand
      name: '@puregamma/dsh-ui-brand'

    # Migration compatibility provider. The existing PureGamma API remains a
    # temporary implementation behind the stable pgMarketData service seam.
    - id: puregamma-market-data-provider
      name: '@puregamma/dsh-market-data-legacy-api'
      config:
        baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000'
        authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN
        requestTimeoutMs: 10000

    - id: puregamma-tool-market-data
      name: '@puregamma/dsh-tool-market-data'

    # Portfolio/NAV follows the same one-way compatibility pattern. The provider
    # requires an authenticated server token and never fabricates an anonymous
    # or zero-value portfolio when no real account snapshot exists.
    - id: puregamma-portfolio-provider
      name: '@puregamma/dsh-portfolio-legacy-api'
      config:
        baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000'
        authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN
        requestTimeoutMs: 10000

    - id: puregamma-tool-portfolio
      name: '@puregamma/dsh-tool-portfolio'

    # pg-tsy-core-bootstrap is an independent Rust runtime pinned under
    # vendor/pg-tsy-core-bootstrap. This provider exposes only its stable local
    # health/control seam. Installing it does not grant live-trading permission
    # and strategy reload remains disabled unless explicitly configured.
    - id: puregamma-pg-tsy-runtime
      name: '@puregamma/dsh-pg-tsy-runtime-http'
      config:
        baseUrl: !!js process.env.PG_TSY_RUNTIME_URL ?? 'http://127.0.0.1:8080'
        requestTimeoutMs: 5000
        allowStrategyReload: false

    - id: puregamma-tool-pg-tsy-runtime
      name: '@puregamma/dsh-tool-pg-tsy-runtime'

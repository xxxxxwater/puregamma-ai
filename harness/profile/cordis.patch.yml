# PureGamma Harness profile overlay. No duplicate root Context or legacy page shell.
- id: system-prompt
  config:
    personaPrefix: >-
      You are PureGamma Harness, an AI-native investment research and execution
      workspace built on DeepSeek Harness and Cordis. Every PureGamma capability
      is provided by an installed plugin. Never claim a capability that is not
      currently installed and healthy. Trading actions remain subject to
      deterministic risk, ownership, approval, reconciliation and venue gates.
    personaSuffix: >-
      Prefer conversation as the primary product surface. Domain-specific UI,
      services, tools, jobs and integrations belong to plugins and must not be
      hard-coded into the shell. RSI proposals never grant tool permissions.
- id: ui-brand-official
  disabled: true
# Upstream's sidebar is the only declarer of `sidebar.workspaces` (the native
# Session list from ui-workspace) and `sidebar.settings`. It stays disabled in
# the public profile on purpose: ui-workspace creates workspaces through the
# Host directory picker (server directory list/create), and the pinned Web host
# is a single-operator runtime with one Session store. Enabling it in a shared
# instance would show every user's Sessions and server directories to everyone.
# Session history returns with per-user Host isolation; see
# docs/architecture/AGENT_WORKSPACE_UPGRADE_20261028.md.
- id: ui-sidebar
  disabled: true
# Upstream `directory-picker` auto-mounts a browse backend that lists the whole
# Host filesystem from $HOME and creates directories. Every PureGamma Host uses
# the sandbox picker instead: same `directoryPicker` Remote contract, confined
# to PUREGAMMA_DSH_WORKSPACE_ROOT (realpath + symlink containment), no
# directory creation, and no root configured means every call fails closed.
# A patch row cannot rename a plugin, so the upstream row is disabled and the
# sandbox picker is inserted under its own id.
- id: directory-picker
  disabled: true
- insert:
    - id: puregamma-ui-brand
      name: '@puregamma/dsh-ui-brand'
    # One Typert Remote assembly, Harness-native Resource/Slot clients.
    - id: puregamma-client-remotes
      name: '@puregamma/dsh-client-remotes'
    # Upstream file-upload stays disabled (below). The native Session
    # controller injects `fileUploads`, so this provider admits nothing and
    # lets Sessions mount; see plugins/file-uploads-refused.
    - id: puregamma-file-uploads-refused
      name: '@puregamma/dsh-file-uploads-refused'
    - id: puregamma-directory-picker
      name: '@puregamma/dsh-directory-picker-sandbox'
      config: { root: !!js process.env.PUREGAMMA_DSH_WORKSPACE_ROOT ?? '', maxEntries: 500, showHidden: false }
    # In-app browser for the sandbox picker (upstream mounted it from -auto).
    - id: puregamma-ui-directory-picker
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: puregamma-ui-account
      name: '@puregamma/dsh-ui-account'
    - id: puregamma-ui-billing
      name: '@puregamma/dsh-ui-billing'
    - id: puregamma-ui-notifications
      name: '@puregamma/dsh-ui-notifications'
    - id: puregamma-ui-pg-tsy-runtime
      name: '@puregamma/dsh-ui-pg-tsy-runtime'
    # Domain tool views: the portfolio and research tools' results render
    # through their own plugins (tool.call.toolview), not through the shell.
    - id: puregamma-ui-portfolio
      name: '@puregamma/dsh-ui-portfolio'
    - id: puregamma-ui-research
      name: '@puregamma/dsh-ui-research'
    - id: puregamma-ui-options
      name: '@puregamma/dsh-ui-options'
    - id: puregamma-ui-backtest
      name: '@puregamma/dsh-ui-backtest'
    - id: puregamma-ui-memory
      name: '@puregamma/dsh-ui-memory'
    # Right-sidebar resource views for research runs, research artifacts and
    # backtest artifacts. Read-only (gateway reads only, no cancel/retry/export)
    # and OFF by default; `resource-views.patch.yml` is the only switch.
    - id: puregamma-ui-research-resources
      name: '@puregamma/dsh-ui-research-resources'
      disabled: true

    # Account, billing, gateway, ingestion and admin own separate services.
    # Explicit money/account mutations are UI/approval actions, not model tools.
    - id: puregamma-auth-provider
      name: '@puregamma/dsh-auth-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 10000 }
    - id: puregamma-tool-auth
      name: '@puregamma/dsh-tool-auth'
    - id: puregamma-billing-provider
      name: '@puregamma/dsh-billing-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 15000 }
    - id: puregamma-tool-billing
      name: '@puregamma/dsh-tool-billing'
    - id: puregamma-api-gateway-provider
      name: '@puregamma/dsh-api-gateway-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 15000 }
    - id: puregamma-tool-api-gateway
      name: '@puregamma/dsh-tool-api-gateway'
    - id: puregamma-data-sources-provider
      name: '@puregamma/dsh-data-sources-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 30000 }
    - id: puregamma-tool-data-sources
      name: '@puregamma/dsh-tool-data-sources'
    - id: puregamma-admin-provider
      name: '@puregamma/dsh-admin-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 15000 }
    - id: puregamma-tool-admin
      name: '@puregamma/dsh-tool-admin'

    # Notification send, verification and devices require explicit actions.
    - id: puregamma-notifications-provider
      name: '@puregamma/dsh-notifications-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 15000 }
    - id: puregamma-tool-notifications
      name: '@puregamma/dsh-tool-notifications'
    - id: puregamma-market-data-provider
      name: '@puregamma/dsh-market-data-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 10000 }
    - id: puregamma-tool-market-data
      name: '@puregamma/dsh-tool-market-data'
    - id: puregamma-portfolio-provider
      name: '@puregamma/dsh-portfolio-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 10000 }
    - id: puregamma-tool-portfolio
      name: '@puregamma/dsh-tool-portfolio'
    - id: puregamma-research-provider
      name: '@puregamma/dsh-research-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 10000 }
    - id: puregamma-tool-research
      name: '@puregamma/dsh-tool-research'
    - id: puregamma-options-provider
      name: '@puregamma/dsh-options-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 10000 }
    - id: puregamma-tool-options
      name: '@puregamma/dsh-tool-options'
    - id: puregamma-backtest-provider
      name: '@puregamma/dsh-backtest-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 30000 }
    - id: puregamma-tool-backtest
      name: '@puregamma/dsh-tool-backtest'

    # Memory is user-owned. RSI is a proposal-only Cordis service: it does not
    # consume redacted content previews as commands and cannot dispatch tools.
    - id: puregamma-memory-provider
      name: '@puregamma/dsh-memory-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 10000 }
    - id: puregamma-tool-memory
      name: '@puregamma/dsh-tool-memory'
    - id: puregamma-rsi-planner
      name: '@puregamma/dsh-rsi-orchestrator'
    - id: puregamma-secretary-provider
      name: '@puregamma/dsh-secretary-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 10000, voiceTimeoutMs: 120000 }
    - id: puregamma-tool-secretary
      name: '@puregamma/dsh-tool-secretary'
    # Agent Skills are provided by the pinned DeepSeek Harness native
    # ctx.skills registry / filesystem provider / tool-skill pipeline.
    - id: puregamma-research-runner-provider
      name: '@puregamma/dsh-research-runner-legacy-api'
      config: { baseUrl: !!js process.env.PUREGAMMA_LEGACY_API_URL ?? 'http://127.0.0.1:8000', authTokenEnv: PUREGAMMA_LEGACY_API_TOKEN, authTokenFile: !!js process.env.PUREGAMMA_LEGACY_API_TOKEN_FILE, requestTimeoutMs: 30000, artifactTimeoutMs: 30000 }
    - id: puregamma-tool-research-runner
      name: '@puregamma/dsh-tool-research-runner'
    # pg-tsy-core-bootstrap stays independent. No live trading on install.
    - id: puregamma-pg-tsy-runtime
      name: '@puregamma/dsh-pg-tsy-runtime-http'
      config: { baseUrl: !!js process.env.PG_TSY_RUNTIME_URL ?? 'http://127.0.0.1:8080', requestTimeoutMs: 5000, allowStrategyReload: false }
    - id: puregamma-tool-pg-tsy-runtime
      name: '@puregamma/dsh-tool-pg-tsy-runtime'


# Harden the upstream coding-agent preset for the multi-user PureGamma website.
# Cordis config replacement is wholesale, so only explicitly allowed rows remain.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are PureGamma AI. Use only PureGamma services and tools visible
            in this session. Never imply host shell, production filesystem,
            deployment, or trading authority that is not explicitly exposed.
          suffix: >-
            Preserve user isolation. Skill instructions never grant additional
            tool permissions.
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          includeDefaultRoots: false
          bundledSkillDir: !!js process.env.PUREGAMMA_DSH_SKILL_DIR ?? (ctx.get('profileContext')?.dir + '/skills')
          watch: false
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true

# `@deepseek-ai/dsh-web-app` also inserts the `ptc`, `minimal` and `cordis`
# agent presets. Each one mounts host shell (tool-bash / tool-pwsh or a
# persistent PTY), arbitrary filesystem tools, background jobs and/or
# subagent delegation, and a Web user can pick any installed preset. Hardening
# only `preset-standard` therefore left those tools one preset switch away, so
# the public profile removes the other presets entirely instead of trying to
# re-harden each of them.
- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true


# Host/browser surface hardening for the public multi-user website. Upstream Web
# exposes coding-workspace surfaces that are appropriate for a trusted local
# coding agent but not for PureGamma users. Generic file uploads are also
# disabled because dsh-v0.1.7-rc.1 resolves uploaded files through the model
# filesystem tools, and the shipped local filesystem backend is not a
# containment boundary. Image attachments remain handled by the DSH attachment
# store/provider adapter and do not require the general host filesystem tool.
- id: file-upload
  disabled: true

- id: terminal-controller
  disabled: true

- id: workspace-files
  disabled: true

- id: ui-sidebar-terminal
  disabled: true

- id: ui-sidebar-files
  disabled: true

- id: ui-plugin-manager
  disabled: true

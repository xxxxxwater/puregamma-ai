name: PureGamma Web E2E

# Browser regression gate for the Agent workspace and the LIVE trading console.
# Every endpoint is stubbed inside the specs; the dev proxy points at a closed
# local port so no test request can reach a real API.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tests/e2e/playwright/**'
      - '.github/workflows/web-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'tests/e2e/playwright/**'
      - '.github/workflows/web-e2e.yml'

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Agent workspace + LIVE console (desktop & mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 'true'
      PLAYWRIGHT_PORT: '3000'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      DEV_API_PROXY_TARGET: http://127.0.0.1:9
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run curated specs
        run: >-
          pnpm exec playwright test
          agent-session-reliability.spec.ts
          chat-design.spec.ts
          harness-workspace.spec.ts
          markdown-render.spec.ts
          live-trading.spec.ts
          live-trading-workflow.spec.ts
          --reporter=line

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            apps/web/test-results
          retention-days: 7

  full-suite:
    # Every spec in tests/e2e/playwright on both projects (chromium,
    # mobile-chrome), fully offline: browser calls are stubbed per spec, the
    # dev proxy points at a closed port, and server-rendered reads go to the
    # checked-in fixture API (tests/e2e/playwright/fixtures/ssr-api.mjs) that
    # playwright.config.ts starts. Sharded so each job stays well under 25 min.
    # route-audit needs a production build and has its own job below.
    name: Full suite shard ${{ matrix.shard }}/4 (desktop & mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 'true'
      PLAYWRIGHT_PORT: '3000'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      DEV_API_PROXY_TARGET: http://127.0.0.1:9
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run shard
        run: >-
          pnpm exec playwright test
          --grep-invert "every route survives an API outage"
          --shard=${{ matrix.shard }}/4
          --reporter=line

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-suite-${{ matrix.shard }}
          path: |
            playwright-report
            apps/web/test-results
          retention-days: 7

  route-audit:
    name: Every route survives an API outage (desktop & mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Production build: no on-demand compilation, and the browser API is the
      # same-origin /__dev-api path the spec stubs to 503. Server-side fetches
      # have no backend at all, which is the outage being tested.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: /__dev-api
          NEXT_PUBLIC_INITIAL_LAUNCH_MODE: 'false'
          REQUIRE_AUTH: 'false'
          NEXT_DIST_DIR: .next-playwright-audit
        run: pnpm build

      - name: Start
        env:
          NEXT_DIST_DIR: .next-playwright-audit
          REQUIRE_AUTH: 'false'
        run: |
          nohup node ./node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3319 > /tmp/next-audit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3319/en && exit 0; sleep 1; done
          cat /tmp/next-audit.log; exit 1

      - name: Audit every route
        env:
          PLAYWRIGHT_PORT: '3319'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3319
        run: pnpm exec playwright test route-audit.spec.ts --reporter=line

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: route-audit
          path: apps/web/test-results
          retention-days: 7

name: Mobile Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.2.2). Empty uses .release-version."
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".release-version"

permissions:
  contents: write
  actions: read

concurrency:
  group: puregamma-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          fetch-depth: 0

      - id: meta
        name: Resolve and validate tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$(tr -d '[:space:]' < .release-version)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag from $(git rev-parse HEAD)"

      - name: Require successful commercial gates for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in commercial-release-gate.yml commercial-readiness.yml; do
            result="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${COMMIT}&status=success&per_page=20")"
            count="$(jq --arg sha "$COMMIT" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success")] | length' <<<"$result")"
            if [ "$count" -lt 1 ]; then
              echo "ERROR: no successful ${workflow} run exists for main commit ${COMMIT}" >&2
              exit 1
            fi
            echo "${workflow}: exact-commit success evidence found"
          done

      - name: Require release commit is contained in current main
        shell: bash
        env:
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main
          echo "release commit is contained in current main"

  source:
    name: Source archive
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Build source archive
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="puregamma-$TAG/" HEAD > "dist/puregamma-$TAG-src.tar.gz"
          test -s "dist/puregamma-$TAG-src.tar.gz"
          sha256sum "dist/puregamma-$TAG-src.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android installable APK
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build installable APK
        working-directory: apps/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug             -PPG_API_BASE_URL=https://api.puregamma.ai --no-daemon

      - name: Stage APK with current app version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts | head -1)"
          test -n "$version"
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "dist/PureGamma-AI-$version.apk"
          sha256sum "dist/PureGamma-AI-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS unsigned IPA
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Build unsigned iOS app
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild -project PureGamma.xcodeproj -scheme PureGamma             -configuration Release -sdk iphoneos -derivedDataPath build             CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 build

      - name: Package IPA with current app version
        run: |
          set -euo pipefail
          version="$(grep -o 'MARKETING_VERSION = [^;]*' apps/ios/PureGamma.xcodeproj/project.pbxproj | head -1 | awk '{print $3}')"
          test -n "$version"
          mkdir -p dist/Payload
          cp -r apps/ios/build/Build/Products/Release-iphoneos/PureGamma.app dist/Payload/
          (
            cd dist
            zip -qr "PureGamma-AI-$version-unsigned.ipa" Payload
            rm -rf Payload
          )
          shasum -a 256 "dist/PureGamma-AI-$version-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish three-asset GitHub release
    needs: [prepare, source, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify exactly three release assets
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.ipa' | wc -l)" -eq 1
          sha256sum dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: "PureGamma AI ${{ needs.prepare.outputs.tag }}"
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true

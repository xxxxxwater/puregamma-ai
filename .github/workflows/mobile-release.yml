name: Mobile Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.1.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build installable APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          # Debug build: signed with the auto-generated debug keystore so the
          # APK can be sideloaded directly. Release builds need a keystore
          # (PG_KEYSTORE_FILE etc.) and stay unsigned without one.
          ./gradlew :app:assembleDebug -PPG_API_BASE_URL=https://api.puregamma.ai --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/PureGamma-AI-1.4.0.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/PureGamma-AI-1.4.0.apk
          fail_on_unmatched_files: true

  ios:
    name: iOS unsigned ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned iOS app (device)
        working-directory: apps/ios
        run: |
          # The app predates Swift 6 strict concurrency; build in Swift 5
          # language mode (concurrency checks become warnings) so release
          # packaging works without a signing identity.
          xcodebuild -project PureGamma.xcodeproj -scheme PureGamma \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 build

      - name: Package ipa
        run: |
          mkdir -p dist/Payload
          cp -r apps/ios/build/Build/Products/Release-iphoneos/PureGamma.app dist/Payload/
          cd dist && zip -qr PureGamma-AI-1.4.0-unsigned.ipa Payload

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/PureGamma-AI-1.4.0-unsigned.ipa
          fail_on_unmatched_files: true

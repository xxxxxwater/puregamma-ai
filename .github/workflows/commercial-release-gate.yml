name: PureGamma Commercial Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: puregamma-commercial-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend safety and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      APP_ENV: test
      ENABLE_MOCK_AGENT: "false"
      ENABLE_MOCK_MARKET_DATA: "false"
      ENABLE_MOCK_DATA_SOURCES: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API and quality dependencies
        run: python -m pip install -r apps/api/requirements.txt ruff

      - name: Compile Python sources
        run: python -m compileall -q apps packages services scripts tests

      - name: Block syntax and undefined-name defects
        run: ruff check apps packages services scripts tests --select E9,F63,F7,F82

      - name: Run security and unit suites
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -rx             tests/security             tests/unit             tests/test_auth.py             tests/test_billing.py             tests/test_captcha.py             tests/test_mobile_auth.py             tests/test_notifications.py             tests/test_dream_rsi_control_plane.py             tests/test_portfolio_connections.py

  web:
    name: SaaS web typecheck lint build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: pnpm run typecheck

      - name: Lint
        working-directory: apps/web
        run: pnpm run lint

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: "false"
          NEXT_PUBLIC_INITIAL_LAUNCH_MODE: "true"
          NEXT_PUBLIC_API_URL: "https://api.puregamma.ai"
        run: pnpm run build

  site:
    name: Marketing site lint and rendered HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install
        working-directory: apps/site
        run: npm ci

      - name: Lint
        working-directory: apps/site
        run: npm run lint

      - name: Build and rendered HTML tests
        working-directory: apps/site
        run: npm test

  production-contract:
    name: Production deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile deployment validators
        run: |
          python3 -m py_compile scripts/validate-production-env.py
          bash -n deploy/deploy.sh
          bash -n deploy/release-final-check.sh

      - name: Verify production compose fail-closed rails
        run: |
          set -euo pipefail
          grep -Fq 'POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?' docker-compose.production.yml
          grep -Fq 'REDIS_PASSWORD: ${REDIS_PASSWORD:?' docker-compose.production.yml
          grep -Fq 'NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: "false"' docker-compose.production.yml
          grep -Fq 'NAUTILUS_LIVE_TRADING_ENABLED: "false"' docker-compose.production.yml
          grep -Fq 'NAUTILUS_ALLOW_LIVE_ORDER: "false"' docker-compose.production.yml
          grep -Fq 'NAUTILUS_ALLOW_WITHDRAWAL: "false"' docker-compose.production.yml
          grep -Fq 'NAUTILUS_ALLOW_TRANSFER: "false"' docker-compose.production.yml

      - name: Verify production env template carries mandatory controls
        run: |
          set -euo pipefail
          grep -q '^APP_ENV=production    runs-on: ubuntu-24.04

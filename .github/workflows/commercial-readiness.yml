name: PureGamma commercial readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: puregamma-commercial-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate deployment scripts
        run: |
          set -euo pipefail
          bash -n deploy/deploy.sh
          bash -n deploy/release-final-check.sh
          python -m py_compile scripts/validate-production-env.py

      - name: Validate production environment contract
        env:
          APP_ENV: production
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          DATABASE_URL: postgresql+psycopg://puregamma:ci-postgres-password@postgres:5432/puregamma
          REDIS_URL: redis://:ci-redis-password@redis:6379/0
          JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj
          SESSION_SECRET: ssssssssssssssssssssssssssssssss
          ENCRYPTION_MASTER_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          INTERNAL_RUNTIME_SECRET: iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii
          METRICS_BEARER_TOKEN: mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm
          NAUTILUS_RUNTIME_SECRET: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn
          STRIPE_SECRET_KEY: sk_live_ci_contract
          STRIPE_WEBHOOK_SECRET: whsec_ci_contract
          NEXT_PUBLIC_API_URL: https://api.puregamma.ai
          SITE_URL: https://app.puregamma.ai
          APP_DOMAIN: app.puregamma.ai
          API_DOMAIN: api.puregamma.ai
          CORS_ORIGINS: https://app.puregamma.ai
          SESSION_COOKIE_DOMAIN: .puregamma.ai
          GOOGLE_OAUTH_REDIRECT_URI: https://api.puregamma.ai/auth/google/callback
          LLM_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ci-deepseek-key
          BILLING_MODE: stripe
          IMESSAGE_PROVIDER: disabled
          AUTH_ALLOW_DEMO_FALLBACK: 'false'
          ENABLE_MOCK_AGENT: 'false'
          ENABLE_MOCK_MARKET_DATA: 'false'
          ENABLE_MOCK_DATA_SOURCES: 'false'
          NAUTILUS_LIVE_TRADING_ENABLED: 'false'
          NAUTILUS_ALLOW_LIVE_ORDER: 'false'
          NAUTILUS_ALLOW_WITHDRAWAL: 'false'
          NAUTILUS_ALLOW_TRANSFER: 'false'
        run: PYTHONPATH=. python scripts/validate-production-env.py

      - name: Validate production Compose graph
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          NAUTILUS_RUNTIME_SECRET: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn
          CORS_ORIGINS: https://app.puregamma.ai
          SESSION_COOKIE_DOMAIN: .puregamma.ai
          JWT_SECRET: jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj
          SESSION_SECRET: ssssssssssssssssssssssssssssssss
          ENCRYPTION_MASTER_KEY: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          INTERNAL_RUNTIME_SECRET: iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii
          LLM_PROVIDER: deepseek
          IMESSAGE_PROVIDER: disabled
          GOOGLE_OAUTH_REDIRECT_URI: https://api.puregamma.ai/auth/google/callback
          DATABASE_URL: postgresql+psycopg://puregamma:ci-postgres-password@postgres:5432/puregamma
          APP_DOMAIN: app.puregamma.ai
          API_DOMAIN: api.puregamma.ai
        run: docker compose -f docker-compose.production.yml config --quiet

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API and quality dependencies
        run: python -m pip install -r apps/api/requirements.txt ruff

      - name: Lint backend
        run: python -m ruff check apps packages services tests

      - name: Run backend suite
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.puregamma.ai
          NEXT_PUBLIC_SITE_URL: https://app.puregamma.ai
          NEXT_PUBLIC_INITIAL_LAUNCH_MODE: 'true'
          NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: 'false'
        run: pnpm build

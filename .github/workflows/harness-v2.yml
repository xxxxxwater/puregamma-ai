name: PureGamma Harness

on:
  push:
    branches:
      - refactor/harness-core-v2
      - main
      - 'upgrade/**'
    paths:
      - 'harness/**'
      - 'vendor/deepseek-harness'
      - 'vendor/pg-tsy-core-bootstrap'
      - '.gitmodules'
      - '.github/workflows/harness-v2.yml'
  pull_request:
    paths:
      - 'harness/**'
      - 'vendor/deepseek-harness'
      - 'vendor/pg-tsy-core-bootstrap'
      - '.gitmodules'
      - '.github/workflows/harness-v2.yml'

concurrency:
  group: puregamma-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned plugin runtimes
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned runtimes
        run: |
          test "$(git -C vendor/deepseek-harness rev-parse HEAD)" = "46a7f68b0922371ce7144b668b90e377d8e799f4"
          test "$(git -C vendor/pg-tsy-core-bootstrap rev-parse HEAD)" = "f5a6382438d8a85e282da5d58d22af9fe5887ca3"

      - name: Verify PureGamma web-agent safety profile
        run: |
          set -euo pipefail
          ! grep -q "@puregamma/dsh-skills-legacy-api" harness/profile/package.json
          ! grep -q "@puregamma/dsh-tool-skills" harness/profile/package.json
          grep -q "includeDefaultRoots: false" harness/profile/cordis.patch.yml
          grep -q "@deepseek-ai/dsh-tool-skill" harness/profile/cordis.patch.yml
          test -z "$(grep -E "name: '@deepseek-ai/dsh-tool-(bash|pwsh|fs|fs-search|jobs|subagent)'" harness/profile/cordis.patch.yml || true)"
          test -z "$(grep -E "name: '@deepseek-ai/dsh-plugin-manager" harness/profile/cordis.patch.yml || true)"
          for id in file-upload terminal-controller workspace-files ui-sidebar-terminal ui-sidebar-files ui-plugin-manager; do
            grep -A2 "^- id: $id$" harness/profile/cordis.patch.yml | grep -q "disabled: true"
          done

      - name: Verify Skill migration and PM NAV source contract
        run: |
          set -euo pipefail
          python3 -m py_compile packages/skills/dsh_migration.py
          python3 - <<'PY'
          from packages.skills.dsh_migration import legacy_slug_to_dsh_name
          assert legacy_slug_to_dsh_name("market_research") == "market-research"
          assert legacy_slug_to_dsh_name("portfolio_review") == "portfolio-review"
          source = open("apps/web/components/pm-account-panel.tsx", encoding="utf-8").read()
          assert "const netUsd = num(point.equity_usd);" in source
          assert 'const heroValue = currency === "USD" ? equityUsd : equityBtc;' in source
          assert "const netUsd = num(point.adjusted_equity_usd);" not in source
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Enable pnpm
        run: corepack enable

      - name: Install pinned DeepSeek Harness build toolchain
        working-directory: vendor/deepseek-harness
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install PureGamma Harness workspace
        working-directory: harness
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and build PureGamma Harness plugins
        working-directory: harness
        run: pnpm run check

      - name: Verify Harness client bundle contract
        run: |
          set -euo pipefail
          for pkg in brand client-remotes ui-account ui-billing ui-notifications ui-pg-tsy-runtime; do
            test -f "harness/plugins/$pkg/lib/index.js"
            test -f "harness/plugins/$pkg/lib/client.js"
            test -f "harness/plugins/$pkg/lib/types/client/index.d.ts"
          done
          test -f harness/packages/client-gateway/lib/typert.host.js
          test -f harness/packages/client-gateway/lib/typert.host.d.ts
          test -f harness/packages/client-gateway/lib/typert.remote-client.js
          test -f harness/packages/client-gateway/lib/typert.remote-client.d.ts

      - name: Verify migrated plugin artifacts
        run: |
          set -euo pipefail
          for pkg in \
            auth auth-legacy-api tool-auth \
            billing billing-legacy-api tool-billing \
            api-gateway api-gateway-legacy-api tool-api-gateway \
            data-sources data-sources-legacy-api tool-data-sources \
            admin admin-legacy-api tool-admin \
            notifications notifications-legacy-api tool-notifications \
            market-data market-data-legacy-api tool-market-data \
            portfolio portfolio-legacy-api tool-portfolio \
            research research-legacy-api tool-research \
            options options-legacy-api tool-options \
            backtest backtest-legacy-api tool-backtest \
            memory memory-legacy-api tool-memory \
            secretary secretary-legacy-api tool-secretary \
            skills skills-legacy-api tool-skills \
            research-runner research-runner-legacy-api tool-research-runner \
            pg-tsy-runtime pg-tsy-runtime-http tool-pg-tsy-runtime \
            trading-mandates; do
            test -f "harness/plugins/$pkg/lib/index.js"
          done

      - name: Verify main-only product sources survive the merge (inventory, not E2E acceptance)
        run: |
          set -euo pipefail
          for path in \
            packages/decisions/jev_client.py \
            packages/decisions/intent.py \
            packages/decisions/rerank.py \
            apps/api/routers/jev_advisory.py \
            apps/web/components/jev-advisory-console.tsx \
            apps/web/components/news-feed.tsx \
            config/rss_sources.yaml \
            apps/web/lib/appearance.ts \
            apps/web/components/chrono/liquid-surface.tsx \
            apps/web/components/terminal/liquid-lens.tsx \
            apps/web/plugins/builtin/registry.ts \
            apps/web/components/pm-account-panel.tsx \
            apps/pocket-relay/main.py; do
            test -s "$path"
          done

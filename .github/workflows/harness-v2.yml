name: PureGamma Harness

on:
  push:
    branches:
      - refactor/harness-core-v2
    paths:
      - 'harness/**'
      - 'vendor/deepseek-harness'
      - 'vendor/pg-tsy-core-bootstrap'
      - '.gitmodules'
      - '.github/workflows/harness-v2.yml'
  pull_request:
    paths:
      - 'harness/**'
      - 'vendor/deepseek-harness'
      - 'vendor/pg-tsy-core-bootstrap'
      - '.gitmodules'
      - '.github/workflows/harness-v2.yml'

concurrency:
  group: puregamma-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned plugin runtimes
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned runtimes
        run: |
          test "$(git -C vendor/deepseek-harness rev-parse HEAD)" = "c291e7961a515f6d7af9304e7fd1d257929aef26"
          test "$(git -C vendor/pg-tsy-core-bootstrap rev-parse HEAD)" = "d7e719b0b2815a1069df9cb4e25c49946dead699"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Enable pnpm
        run: corepack enable

      - name: Install pinned DeepSeek Harness build toolchain
        working-directory: vendor/deepseek-harness
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install PureGamma Harness workspace
        working-directory: harness
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and build PureGamma Harness plugins
        working-directory: harness
        run: pnpm run check

      - name: Verify Harness client bundle contract
        run: |
          test -f harness/plugins/brand/lib/index.js
          test -f harness/plugins/brand/lib/client.js
          test -f harness/plugins/brand/lib/types/client/index.d.ts

      - name: Verify migrated plugin artifacts
        run: |
          test -f harness/plugins/market-data/lib/index.js
          test -f harness/plugins/market-data-legacy-api/lib/index.js
          test -f harness/plugins/tool-market-data/lib/index.js
          test -f harness/plugins/portfolio/lib/index.js
          test -f harness/plugins/portfolio-legacy-api/lib/index.js
          test -f harness/plugins/tool-portfolio/lib/index.js
          test -f harness/plugins/research/lib/index.js
          test -f harness/plugins/research-legacy-api/lib/index.js
          test -f harness/plugins/tool-research/lib/index.js
          test -f harness/plugins/options/lib/index.js
          test -f harness/plugins/options-legacy-api/lib/index.js
          test -f harness/plugins/tool-options/lib/index.js
          test -f harness/plugins/backtest/lib/index.js
          test -f harness/plugins/backtest-legacy-api/lib/index.js
          test -f harness/plugins/tool-backtest/lib/index.js
          test -f harness/plugins/memory/lib/index.js
          test -f harness/plugins/memory-legacy-api/lib/index.js
          test -f harness/plugins/tool-memory/lib/index.js
          test -f harness/plugins/secretary/lib/index.js
          test -f harness/plugins/secretary-legacy-api/lib/index.js
          test -f harness/plugins/tool-secretary/lib/index.js
          test -f harness/plugins/pg-tsy-runtime/lib/index.js
          test -f harness/plugins/pg-tsy-runtime-http/lib/index.js
          test -f harness/plugins/tool-pg-tsy-runtime/lib/index.js

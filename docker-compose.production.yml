services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: puregamma
      POSTGRES_USER: puregamma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    mem_limit: 768m
    cpus: 0.60
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puregamma -d puregamma"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Authentication is required in production; REDIS_URL in .env must carry the
    # matching password (redis://:${REDIS_PASSWORD}@redis:6379/0). The env var is
    # interpolated at container start, not baked into the image.
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata:/data
    networks: [data]
    mem_limit: 512m
    cpus: 0.30
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nautilus-runtime:
    build:
      context: .
      dockerfile: services/nautilus-runtime/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      NAUTILUS_RUNTIME_SECRET: ${NAUTILUS_RUNTIME_SECRET:?NAUTILUS_RUNTIME_SECRET is required}
      NAUTILUS_EXECUTION_MODE: paper
      NAUTILUS_LIVE_TRADING_ENABLED: "false"
      NAUTILUS_ALLOW_LIVE_ORDER: "false"
      NAUTILUS_ALLOW_WITHDRAWAL: "false"
      NAUTILUS_ALLOW_TRANSFER: "false"
      NAUTILUS_RUNTIME_STATE_DB: /runtime/state/nautilus_runtime.sqlite3
    expose: ["8090"]
    volumes:
      - nautilus_state:/runtime/state
    networks: [runtime, egress]
    mem_limit: 512m
    cpus: 0.35
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        INSTALL_DOCKER_CLI: 'false'
    environment:
      APP_ENV: production
      SITE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required, for example https://app.puregamma.ai}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:?SESSION_COOKIE_DOMAIN is required, for example .puregamma.ai}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      INTERNAL_RUNTIME_SECRET: ${INTERNAL_RUNTIME_SECRET:?INTERNAL_RUNTIME_SECRET is required}
      BILLING_MODE: ${BILLING_MODE:-stripe}
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required and must be openai or deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      GATEWAY_ENABLED: ${GATEWAY_ENABLED:-false}
      GATEWAY_API_KEY_PEPPER: ${GATEWAY_API_KEY_PEPPER:-}
      GATEWAY_DEEPSEEK_API_KEY: ${GATEWAY_DEEPSEEK_API_KEY:-}
      GATEWAY_MOONSHOT_API_KEY: ${GATEWAY_MOONSHOT_API_KEY:-}
      GATEWAY_GLM_API_KEY: ${GATEWAY_GLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_LUNA_ENABLED: ${OPENAI_LUNA_ENABLED:-false}
      OPENAI_LUNA_MODEL: ${OPENAI_LUNA_MODEL:-gpt-5.6-luna}
      OPENAI_LUNA_ALLOWED_PLANS: ${OPENAI_LUNA_ALLOWED_PLANS:-Max,Enterprise}
      OPENAI_LUNA_TIMEOUT_SECONDS: ${OPENAI_LUNA_TIMEOUT_SECONDS:-90}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      NOIZ_API_KEY: ${NOIZ_API_KEY:-}
      NOIZ_VOICE_ID: ${NOIZ_VOICE_ID:-183203aa0}
      NOIZ_ENGLISH_VOICE_ID: ${NOIZ_ENGLISH_VOICE_ID:-7bc8b578}
      ENABLE_MOCK_AGENT: "false"
      ENABLE_MOCK_MARKET_DATA: "false"
      ENABLE_MOCK_DATA_SOURCES: "false"
      IMESSAGE_PROVIDER: ${IMESSAGE_PROVIDER:?IMESSAGE_PROVIDER is required; use disabled or macos_relay}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: https://${APP_DOMAIN}/billing/success
      STRIPE_CANCEL_URL: https://${APP_DOMAIN}/billing/cancel
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:?GOOGLE_OAUTH_REDIRECT_URI is required}
      NAUTILUS_RUNTIME_SECRET: ${NAUTILUS_RUNTIME_SECRET:?NAUTILUS_RUNTIME_SECRET is required}
      INITIAL_LAUNCH_MODE: "true"
      AUTH_ALLOW_DEMO_FALLBACK: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      NAUTILUS_RUNTIME_URL: http://nautilus-runtime:8090
      BACKTEST_ARTIFACT_DIR: ${BACKTEST_ARTIFACT_DIR:-/var/lib/puregamma/backtests}
    expose: ["8000"]
    volumes:
      - backtest_artifacts:/var/lib/puregamma/backtests
      # No docker.sock here: the API only probes runner availability and
      # honestly reports it as unavailable. A compromised web-facing container
      # must never reach the host docker engine (host root + all secrets).
    networks: [edge, data, runtime]
    mem_limit: 640m
    cpus: 0.65
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nautilus-runtime: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "celery -A packages.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=$${WORKER_CONCURRENCY:-2}"]
    environment:
      APP_ENV: production
      NAUTILUS_RUNTIME_SECRET: ${NAUTILUS_RUNTIME_SECRET:?NAUTILUS_RUNTIME_SECRET is required}
      INTERNAL_RUNTIME_SECRET: ${INTERNAL_RUNTIME_SECRET:?INTERNAL_RUNTIME_SECRET is required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required and must be openai or deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      GATEWAY_ENABLED: ${GATEWAY_ENABLED:-false}
      GATEWAY_API_KEY_PEPPER: ${GATEWAY_API_KEY_PEPPER:-}
      GATEWAY_DEEPSEEK_API_KEY: ${GATEWAY_DEEPSEEK_API_KEY:-}
      GATEWAY_MOONSHOT_API_KEY: ${GATEWAY_MOONSHOT_API_KEY:-}
      GATEWAY_GLM_API_KEY: ${GATEWAY_GLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_LUNA_ENABLED: ${OPENAI_LUNA_ENABLED:-false}
      OPENAI_LUNA_MODEL: ${OPENAI_LUNA_MODEL:-gpt-5.6-luna}
      OPENAI_LUNA_ALLOWED_PLANS: ${OPENAI_LUNA_ALLOWED_PLANS:-Max,Enterprise}
      OPENAI_LUNA_TIMEOUT_SECONDS: ${OPENAI_LUNA_TIMEOUT_SECONDS:-90}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      NAUTILUS_RUNTIME_URL: http://nautilus-runtime:8090
      BACKTEST_ARTIFACT_DIR: ${BACKTEST_ARTIFACT_DIR:-/var/lib/puregamma/backtests}
      RESEARCH_RUNNER_IMAGE: ${RESEARCH_RUNNER_IMAGE:-puregamma-research-runner:1}
      # Host-visible job/dataset dirs: sibling research containers can only
      # mount HOST paths, so the worker writes job files on a bind mount that
      # exists at the same absolute path on the host.
      RESEARCH_RUNNER_JOB_DIR: ${RESEARCH_RUNNER_JOB_DIR:-/var/lib/puregamma/research-jobs/jobs}
      RESEARCH_RUNNER_DATA_DIRS: ${RESEARCH_RUNNER_DATA_DIRS:-/var/lib/puregamma/research-jobs/datasets}
      RESEARCH_RUNNER_CONTAINER_USER: ${RESEARCH_RUNNER_CONTAINER_USER:-10001:10001}
    volumes:
      # Research runner figures/datasets share the artifact store with the API.
      - backtest_artifacts:/var/lib/puregamma/backtests
      # Optional: lets the worker spawn ephemeral sibling containers for the
      # isolated research runner. On hosts without Docker, remove this mount;
      # the runner then honestly reports runs as "unavailable" (never faked).
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RESEARCH_JOBS_HOST_DIR:-/var/lib/puregamma/research-jobs}:/var/lib/puregamma/research-jobs
    # Host docker group (stat -c %g /var/run/docker.sock): lets the non-root
    # container user reach the socket to spawn research containers.
    group_add: ["${DOCKER_SOCKET_GID:-107}"]
    networks: [data, runtime, egress]
    mem_limit: 768m
    cpus: 0.70
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "packages.workers.scheduler"]
    environment:
      APP_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      DATA_SYNC_WORKER_ENABLED: ${DATA_SYNC_WORKER_ENABLED:-true}
      BLOOMBERG_MODE: ${BLOOMBERG_MODE:-disabled}
      RSS_SYNC_INTERVAL: ${RSS_SYNC_INTERVAL:-10}
      FINTWIT_SYNC_INTERVAL: ${FINTWIT_SYNC_INTERVAL:-15}
      X_SYNC_INTERVAL: ${X_SYNC_INTERVAL:-15}
      NAUTILUS_RUNTIME_SYNC_INTERVAL_SECONDS: ${NAUTILUS_RUNTIME_SYNC_INTERVAL_SECONDS:-15}
      NAUTILUS_RECONCILE_INTERVAL_MINUTES: ${NAUTILUS_RECONCILE_INTERVAL_MINUTES:-5}
      NAUTILUS_MARKET_REFRESH_INTERVAL_SECONDS: ${NAUTILUS_MARKET_REFRESH_INTERVAL_SECONDS:-15}
    networks: [data]
    mem_limit: 192m
    cpus: 0.20
    pids_limit: 96
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?API_DOMAIN is required}
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
        NEXT_PUBLIC_INITIAL_LAUNCH_MODE: "true"
        NEXT_PUBLIC_ALLOW_MOCK_FALLBACK: "false"
    restart: unless-stopped
    environment:
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pg_session}
      REQUIRE_AUTH: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 15s
      retries: 10
    expose: ["3000"]
    networks: [edge]
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 192
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    mem_limit: 128m
    cpus: 0.10
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  nautilus_state:
  backtest_artifacts:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  runtime:
    driver: bridge
    internal: true
  egress:
    driver: bridge

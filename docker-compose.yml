services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: puregamma
      POSTGRES_USER: puregamma
      POSTGRES_PASSWORD: puregamma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puregamma -d puregamma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://puregamma:puregamma@postgres:5432/puregamma
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  imessage-relay:
    build:
      context: ./apps/imessage-relay
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8787:8787"

volumes:
  pgdata:
